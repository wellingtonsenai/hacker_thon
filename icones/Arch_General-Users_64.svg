<?xml version="1.0" encoding="UTF-8"?>
<svg width="80px" height="80px" viewBox="0 0 80 80" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <title>General-Users</title>
  <!-- fundo degradê no estilo AWS General -->
  <defs>
    <linearGradient id="users-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4B6584"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="12" fill="url(#users-bg)"/>
  <!-- usuário principal (centro) -->
  <circle cx="40" cy="26" r="11" fill="#FFFFFF" opacity="0.95"/>
  <path d="M18,62 C18,48 28,42 40,42 C52,42 62,48 62,62 Z"
        fill="#FFFFFF" opacity="0.95"/>
  <!-- usuário secundário (direita, menor) -->
  <circle cx="60" cy="30" r="7.5" fill="#FFFFFF" opacity="0.65"/>
  <path d="M46,62 C47,53 53,49 60,49 C67,49 73,53 74,62 Z"
        fill="#FFFFFF" opacity="0.65"/>
  <!-- usuário terciário (esquerda, menor) -->
  <circle cx="20" cy="30" r="7.5" fill="#FFFFFF" opacity="0.65"/>
  <path d="M6,62 C7,53 13,49 20,49 C27,49 33,53 34,62 Z"
        fill="#FFFFFF" opacity="0.65"/>
</svg>
