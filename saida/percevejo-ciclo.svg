<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, sans-serif">

  <!-- Fundo -->
  <rect width="900" height="520" fill="#F8F8F8" rx="16"/>

  <!-- Título -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0E1D8E">Ciclo de Vida do Percevejo</text>

  <!-- ===== SETA CIRCULAR (arco de fundo) ===== -->
  <!-- Arco grande indicando ciclo -->
  <path d="M450,260 m-175,0 a175,175 0 1,1 350,0" fill="none" stroke="#CBD5E1" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
  <path d="M450,260 m175,0 a175,175 0 0,1 -20,87" fill="none" stroke="#0E1D8E" stroke-width="4" stroke-dasharray="8,5" opacity="0.5"/>

  <!-- ===== ESTÁGIO 1 — OVO (topo) ===== -->
  <circle cx="450" cy="78" r="46" fill="#FEF1E2" stroke="#F08305" stroke-width="3"/>
  <!-- ovos em cluster -->
  <ellipse cx="440" cy="78" rx="8" ry="10" fill="#e8c87a" stroke="#b08030" stroke-width="1.2"/>
  <ellipse cx="453" cy="74" rx="8" ry="10" fill="#e8c87a" stroke="#b08030" stroke-width="1.2"/>
  <ellipse cx="460" cy="83" rx="8" ry="10" fill="#e8c87a" stroke="#b08030" stroke-width="1.2"/>
  <ellipse cx="446" cy="88" rx="7" ry="9" fill="#e8c87a" stroke="#b08030" stroke-width="1.2"/>
  <text x="450" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#F08305">1. Ovo</text>
  <text x="450" y="156" text-anchor="middle" font-size="11" fill="#555">~5 dias para eclodir</text>

  <!-- ===== ESTÁGIO 2 — NINFA 1 (direita-topo) ===== -->
  <circle cx="694" cy="175" r="46" fill="#FBE8F2" stroke="#C71D81" stroke-width="3"/>
  <!-- ninfa pequena sem asas -->
  <ellipse cx="694" cy="179" rx="16" ry="13" fill="#8FA04A" stroke="#4a5a1a" stroke-width="1.5"/>
  <ellipse cx="694" cy="167" rx="11" ry="9" fill="#8FA04A" stroke="#4a5a1a" stroke-width="1.5"/>
  <circle cx="689" cy="164" r="3" fill="#CC3300"/>
  <circle cx="699" cy="164" r="3" fill="#CC3300"/>
  <line x1="684" y1="165" x2="670" y2="158" stroke="#3a2a00" stroke-width="1.5"/>
  <line x1="704" y1="165" x2="718" y2="158" stroke="#3a2a00" stroke-width="1.5"/>
  <text x="694" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="#C71D81">2. Ninfa 1</text>
  <text x="694" y="253" text-anchor="middle" font-size="11" fill="#555">recém-eclodida</text>

  <!-- ===== ESTÁGIO 3 — NINFAS 2-4 (direita-baixo) ===== -->
  <circle cx="694" cy="345" r="46" fill="#F4E8F5" stroke="#85228B" stroke-width="3"/>
  <!-- ninfa média, boton de asa -->
  <ellipse cx="694" cy="349" rx="19" ry="15" fill="#7B8B3A" stroke="#4a5a1a" stroke-width="1.5"/>
  <ellipse cx="694" cy="334" rx="13" ry="10" fill="#8FA04A" stroke="#4a5a1a" stroke-width="1.5"/>
  <circle cx="688" cy="331" r="3.5" fill="#CC3300"/>
  <circle cx="700" cy="331" r="3.5" fill="#CC3300"/>
  <!-- botons de asa -->
  <path d="M676,345 Q665,348 663,358" stroke="#4a5a1a" stroke-width="2" fill="none"/>
  <path d="M712,345 Q723,348 725,358" stroke="#4a5a1a" stroke-width="2" fill="none"/>
  <line x1="684" y1="332" x2="668" y2="322" stroke="#3a2a00" stroke-width="1.5"/>
  <line x1="704" y1="332" x2="720" y2="322" stroke="#3a2a00" stroke-width="1.5"/>
  <text x="694" y="407" text-anchor="middle" font-size="14" font-weight="bold" fill="#85228B">3. Ninfas 2–4</text>
  <text x="694" y="423" text-anchor="middle" font-size="11" fill="#555">4 mudas, ~30 dias</text>

  <!-- ===== ESTÁGIO 4 — ADULTO (baixo-centro) ===== -->
  <circle cx="450" cy="435" r="46" fill="#E8EAF6" stroke="#0E1D8E" stroke-width="3"/>
  <!-- adulto com asas -->
  <ellipse cx="450" cy="439" rx="22" ry="17" fill="#7B8B3A" stroke="#4a5a1a" stroke-width="1.5"/>
  <ellipse cx="450" cy="422" rx="14" ry="11" fill="#8FA04A" stroke="#4a5a1a" stroke-width="1.5"/>
  <circle cx="443" cy="419" r="4" fill="#CC3300"/>
  <circle cx="457" cy="419" r="4" fill="#CC3300"/>
  <path d="M430,430 Q408,430 400,447" stroke="#D4E890" stroke-width="3" fill="none"/>
  <path d="M470,430 Q492,430 500,447" stroke="#D4E890" stroke-width="3" fill="none"/>
  <line x1="440" y1="420" x2="422" y2="410" stroke="#3a2a00" stroke-width="1.5"/>
  <line x1="460" y1="420" x2="478" y2="410" stroke="#3a2a00" stroke-width="1.5"/>
  <text x="450" y="497" text-anchor="middle" font-size="14" font-weight="bold" fill="#0E1D8E">4. Adulto</text>

  <!-- ===== ESTÁGIO 5 — POSTURA (esquerda-baixo) ===== -->
  <circle cx="206" cy="345" r="46" fill="#FEF1E2" stroke="#F08305" stroke-width="3"/>
  <!-- adulto fêmea + ovos -->
  <ellipse cx="200" cy="348" rx="17" ry="13" fill="#7B8B3A" stroke="#4a5a1a" stroke-width="1.5"/>
  <ellipse cx="200" cy="335" rx="11" ry="9" fill="#8FA04A" stroke="#4a5a1a" stroke-width="1.5"/>
  <!-- ovos pequenos ao lado -->
  <ellipse cx="222" cy="355" rx="5" ry="6" fill="#e8c87a" stroke="#b08030" stroke-width="1"/>
  <ellipse cx="230" cy="348" rx="5" ry="6" fill="#e8c87a" stroke="#b08030" stroke-width="1"/>
  <ellipse cx="228" cy="358" rx="5" ry="6" fill="#e8c87a" stroke="#b08030" stroke-width="1"/>
  <text x="206" y="407" text-anchor="middle" font-size="14" font-weight="bold" fill="#F08305">5. Postura</text>
  <text x="206" y="423" text-anchor="middle" font-size="11" fill="#555">até 400 ovos/fêmea</text>

  <!-- ===== SETAS ENTRE ESTÁGIOS ===== -->
  <!-- 1 → 2 (ovo → ninfa 1) -->
  <path d="M492,100 Q590,120 655,150" fill="none" stroke="#0E1D8E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 2 → 3 (ninfa1 → ninfas 2-4) -->
  <path d="M694,222 L694,298" fill="none" stroke="#0E1D8E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 3 → 4 (ninfas → adulto) -->
  <path d="M655,368 Q590,400 497,425" fill="none" stroke="#0E1D8E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 4 → 5 (adulto → postura) -->
  <path d="M403,425 Q320,405 253,373" fill="none" stroke="#0E1D8E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- 5 → 1 (postura → ovo) -->
  <path d="M200,298 Q200,200 408,95" fill="none" stroke="#0E1D8E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Marcador de seta -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0E1D8E"/>
    </marker>
  </defs>

  <!-- Duração no centro -->
  <circle cx="450" cy="260" r="52" fill="white" stroke="#CBD5E1" stroke-width="2"/>
  <text x="450" y="253" text-anchor="middle" font-size="12" fill="#555">ciclo completo</text>
  <text x="450" y="270" text-anchor="middle" font-size="20" font-weight="bold" fill="#0E1D8E">45 dias</text>
  <text x="450" y="287" text-anchor="middle" font-size="11" fill="#888">em clima quente</text>

  <!-- Rodapé -->
  <text x="450" y="510" text-anchor="middle" font-size="11" fill="#888">Metamorfose incompleta (hemimetabolia) — sem estágio de pupa</text>
</svg>
